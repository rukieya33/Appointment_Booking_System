# Clean port mapping to avoid system ghost processes
server.port=5000

# PostgreSQL Settings (Ensure a database named 'appointment_db' exists locally)
spring.datasource.url=jdbc:postgresql://localhost:5432/appointment_booking_system_db
spring.datasource.username=postgres
spring.datasource.password=roses
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Strategy rules
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
